<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My ChatGPT Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Saved Chats</h2>
        <button id="sidebarToggle" class="sidebar-toggle">✕</button>
      </div>
      <div id="savedChatsList" class="saved-chats-list"></div>
    </aside>

    <div class="main-container">
      <div class="app-header">
        <div class="header-left">
          <button id="sidebarToggleOpen" class="sidebar-toggle-open" title="Toggle menu">☰</button>
          <button id="saveBtn" class="secondary">Save chat</button>
          <div class="brand">
            <div class="brand-mark">AI</div>
            <div>
              <h1>ChatClone</h1>
              <p>Powered by Ollama</p>
            </div>
          </div>
        </div>
        <button id="clearBtn" class="secondary">New chat</button>
      </div>

      <main class="chat-panel">
        <div id="chat" class="chat-window" aria-live="polite"></div>
      </main>

      <footer class="composer">
        <div class="composer-input">
          <textarea id="userInput" placeholder="Type a message..." rows="1"></textarea>
        </div>
        <div class="composer-actions">
          <button id="sendBtn" class="primary">Send</button>
          <div id="spinner" class="spinner hidden" aria-hidden="true"></div>
        </div>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
